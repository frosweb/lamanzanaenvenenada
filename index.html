<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Buscador Seguro por URL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #020617; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        .mask-text { font-family: monospace; letter-spacing: 0.15em; }
        .touch-active:active { transform: scale(0.97); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-20 shadow-xl">
        <div class="max-w-7xl mx-auto px-3.5 py-3 sm:px-6 lg:px-8 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-2.5">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2 rounded-xl shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-user-shield text-white text-base"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-bold text-white tracking-tight">Gestor Cifrado</h1>
                    <p class="text-[11px] text-slate-400" id="total-count">Esperando clave de descifrado...</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5">
                <button onclick="toggleAllVisibility()" id="btn-toggle-all" class="bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 border border-slate-700/60 p-2 sm:px-3 sm:py-2 rounded-xl text-xs font-medium flex items-center gap-1.5 touch-active">
                    <i class="fa-solid fa-eye text-sm" id="toggle-all-icon"></i>
                    <span id="toggle-all-text" class="hidden sm:inline">Revelar Todo</span>
                </button>

                <button onclick="openModalForAdd()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 sm:px-3.5 sm:py-2 rounded-xl font-medium text-xs flex items-center gap-1.5 touch-active">
                    <i class="fa-solid fa-plus text-sm"></i> <span class="hidden sm:inline">Nuevo</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Master Password Prompt -->
    <div id="auth-banner" class="bg-indigo-950/40 border-b border-indigo-500/30 p-3 px-4">
        <div class="max-w-md mx-auto flex gap-2">
            <input type="password" id="master-key" placeholder="Introduce la contraseña maestra para desencriptar..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="decryptUrlData()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-medium whitespace-nowrap">Desbloquear</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3 py-4 sm:px-6 lg:px-8 flex flex-col gap-4">

        <!-- Search Bar -->
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </div>
            <input type="password" id="search-input" onkeyup="filterRecords()" 
                placeholder="Buscar correo, clave, RIF, cédula o notas..." 
                class="w-full pl-10 pr-20 py-3 bg-slate-900/90 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 shadow-inner text-xs sm:text-sm transition-all mask-text">
            
            <div class="absolute inset-y-0 right-0 pr-2 flex items-center gap-1">
                <button type="button" onclick="toggleSearchInputVisibility()" class="text-slate-500 hover:text-slate-300 p-2 rounded-lg">
                    <i class="fa-solid fa-eye-slash text-xs sm:text-sm" id="toggle-search-icon"></i>
                </button>
                <button id="clear-search" onclick="clearSearch()" class="hidden text-slate-500 hover:text-slate-200 p-2 rounded-lg">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Mobile & Desktop Views -->
        <div class="flex-1 flex flex-col">
            <div class="hidden md:block bg-slate-900/50 backdrop-blur-xl rounded-2xl border border-slate-800/80 shadow-2xl overflow-hidden flex-1">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-900/90 border-b border-slate-800 text-slate-400 font-semibold uppercase text-[11px] tracking-wider">
                                <th class="py-3.5 px-5">Correo / Usuario</th>
                                <th class="py-3.5 px-5">Contraseña / RIF / Cédula</th>
                                <th class="py-3.5 px-5">Detalles / Notas</th>
                                <th class="py-3.5 px-5 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-800/50"></tbody>
                    </table>
                </div>
            </div>

            <div id="mobile-cards-container" class="md:hidden flex flex-col gap-3"></div>

            <div id="empty-state" class="py-12 text-center text-slate-500">
                <i class="fa-solid fa-shield-cat text-3xl mb-2 opacity-30"></i>
                <p class="text-xs" id="empty-msg">Ingresa tu clave maestra para ver la información alojada en la URL.</p>
            </div>
        </div>
    </main>

    <!-- Modal Form for Adding/Editing Records -->
    <div id="record-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-t-2xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl relative">
            <h3 id="modal-title" class="text-base font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-key text-indigo-400"></i> Nuevo Registro
            </h3>
            <form id="record-form" onsubmit="saveRecord(event)" class="space-y-3.5">
                <input type="hidden" id="modal-id">
                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-1">Correo o Usuario *</label>
                    <input type="text" id="modal-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white outline-none text-xs sm:text-sm">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-1">Clave / RIF / Cédula</label>
                    <input type="text" id="modal-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white outline-none text-xs sm:text-sm">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-400 mb-1">Detalles / Notas Adicionales</label>
                    <textarea id="modal-notes" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white outline-none text-xs sm:text-sm"></textarea>
                </div>
                <div class="flex justify-end gap-2.5 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-slate-800 text-slate-300 rounded-xl text-xs">Cancelar</button>
                    <button type="submit" class="px-4 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-medium">Guardar y Encriptar en URL</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 bg-indigo-600 text-white px-4 py-2.5 rounded-xl shadow-2xl transition-all duration-300 opacity-0 translate-y-10 flex items-center gap-2 z-50 text-xs font-medium">
        <i class="fa-solid fa-circle-check text-sm"></i>
        <span id="toast-msg">Acción completada</span>
    </div>

    <script>
        let records = [];
        let currentPasskey = '';
        let visiblePasswords = {};
        let visibleNotes = {};
        let allVisible = false;

        function decryptUrlData() {
            const passkey = document.getElementById('master-key').value.trim();
            const hash = window.location.hash.substring(1);

            if (!passkey) {
                showToast("Por favor ingresa tu contraseña maestra");
                return;
            }

            if (!hash) {
                document.getElementById('empty-msg').textContent = "La URL no contiene información cifrada (#).";
                return;
            }

            try {
                const bytes = CryptoJS.AES.decrypt(hash, passkey);
                const decryptedData = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));

                if (Array.isArray(decryptedData)) {
                    records = decryptedData;
                    currentPasskey = passkey;
                    document.getElementById('auth-banner').classList.add('hidden');
                    renderData(records);
                    showToast("Datos desencriptados con éxito");
                } else {
                    throw new Error("Formato inválido");
                }
            } catch (e) {
                showToast("Contraseña maestra incorrecta");
            }
        }

        function updateUrlHash() {
            if (!currentPasskey) return;
            const encrypted = CryptoJS.AES.encrypt(JSON.stringify(records), currentPasskey).toString();
            window.history.replaceState(null, null, '#' + encrypted);
        }

        function renderData(data) {
            const tbody = document.getElementById('table-body');
            const mobileContainer = document.getElementById('mobile-cards-container');
            const emptyState = document.getElementById('empty-state');
            const countLabel = document.getElementById('total-count');

            tbody.innerHTML = '';
            mobileContainer.innerHTML = '';
            countLabel.textContent = `${data.length} de ${records.length} datos`;

            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                document.getElementById('empty-msg').textContent = "No se encontraron registros.";
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            data.forEach((item) => {
                const isPassVisible = visiblePasswords[item.id] || allVisible;
                const isNoteVisible = visibleNotes[item.id] || allVisible;
                
                const maskPass = "••••••••";
                const maskNote = "••••••••••••";
                
                const displayPassword = isPassVisible ? (item.password || '---') : maskPass;
                const displayNotes = isNoteVisible ? item.notes : maskNote;

                // Desktop Row
                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-800/40 transition-colors group';
                row.innerHTML = `
                    <td class="py-3.5 px-5 text-slate-100 font-medium">
                        <div class="flex items-center gap-2">
                            <span class="break-all">${escapeHtml(item.email)}</span>
                            <button onclick="copyToClipboard('${escapeJs(item.email)}')" class="text-slate-600 hover:text-indigo-400 opacity-0 group-hover:opacity-100 p-1"><i class="fa-regular fa-copy"></i></button>
                        </div>
                    </td>
                    <td class="py-3.5 px-5 font-mono text-slate-300">
                        <div class="flex items-center gap-2">
                            <span class="bg-slate-950/80 px-2.5 py-1 rounded-lg border border-slate-800 text-xs tracking-wider">${escapeHtml(displayPassword)}</span>
                            ${item.password ? `
                            <button onclick="toggleVisibility(${item.id})" class="text-slate-500 hover:text-indigo-400 p-1"><i class="fa-solid ${isPassVisible ? 'fa-eye-slash' : 'fa-eye'}"></i></button>
                            <button onclick="copyToClipboard('${escapeJs(item.password)}')" class="text-slate-600 hover:text-indigo-400 opacity-0 group-hover:opacity-100 p-1"><i class="fa-regular fa-copy"></i></button>` : ''}
                        </div>
                    </td>
                    <td class="py-3.5 px-5 text-slate-400 text-xs">
                        ${item.notes ? `
                        <div class="flex items-center gap-2">
                            <span class="bg-indigo-950/30 text-indigo-300 border border-indigo-800/30 px-2.5 py-1 rounded-lg inline-block max-w-xs truncate ${!isNoteVisible ? 'mask-text' : ''}">
                                ${escapeHtml(displayNotes)}
                            </span>
                            <button onclick="toggleNoteVisibility(${item.id})" class="text-slate-500 hover:text-indigo-400 p-1"><i class="fa-solid ${isNoteVisible ? 'fa-eye-slash' : 'fa-eye'}"></i></button>
                        </div>` : '<span class="text-slate-700">-</span>'}
                    </td>
                    <td class="py-3.5 px-5 text-center">
                        <div class="flex justify-center items-center gap-1.5">
                            <button onclick="copyRow('${escapeJs(item.email)}', '${escapeJs(item.password)}', '${escapeJs(item.notes)}')" class="bg-slate-800 hover:bg-indigo-600 text-slate-400 hover:text-white px-2.5 py-1.5 rounded-lg text-xs"><i class="fa-regular fa-clone"></i></button>
                            <button onclick="openModalForEdit(${item.id})" class="bg-slate-800 hover:bg-amber-600 text-slate-400 hover:text-white px-2.5 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteRecord(${item.id})" class="bg-slate-800 hover:bg-rose-600 text-slate-400 hover:text-white px-2.5 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);

                // Mobile Card
                const card = document.createElement('div');
                card.className = 'bg-slate-900/80 border border-slate-800/90 rounded-2xl p-3.5 flex flex-col gap-2.5 shadow-lg';
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <div class="flex-1 min-w-0">
                            <div class="text-[10px] text-slate-500 uppercase font-semibold">Correo / Usuario</div>
                            <div class="text-xs font-semibold text-slate-100 truncate flex items-center gap-1.5">
                                <span class="truncate">${escapeHtml(item.email)}</span>
                                <button onclick="copyToClipboard('${escapeJs(item.email)}')" class="text-slate-500 hover:text-indigo-400 p-1"><i class="fa-regular fa-copy text-xs"></i></button>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 bg-slate-950/60 border border-slate-800 rounded-xl p-1">
                            <button onclick="copyRow('${escapeJs(item.email)}', '${escapeJs(item.password)}', '${escapeJs(item.notes)}')" class="p-1.5 text-slate-400 hover:text-indigo-400"><i class="fa-regular fa-clone text-xs"></i></button>
                            <button onclick="openModalForEdit(${item.id})" class="p-1.5 text-slate-400 hover:text-amber-400"><i class="fa-solid fa-pen-to-square text-xs"></i></button>
                            <button onclick="deleteRecord(${item.id})" class="p-1.5 text-slate-400 hover:text-rose-400"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>
                    <div class="flex justify-between items-center gap-2 bg-slate-950/40 p-2 rounded-xl border border-slate-800/50">
                        <div>
                            <div class="text-[10px] text-slate-500 font-semibold">Clave / RIF</div>
                            <div class="font-mono text-xs text-slate-200 tracking-wider">${escapeHtml(displayPassword)}</div>
                        </div>
                        ${item.password ? `
                        <div class="flex items-center gap-1">
                            <button onclick="toggleVisibility(${item.id})" class="p-1.5 text-slate-500 hover:text-indigo-400"><i class="fa-solid ${isPassVisible ? 'fa-eye-slash' : 'fa-eye'} text-xs"></i></button>
                            <button onclick="copyToClipboard('${escapeJs(item.password)}')" class="p-1.5 text-slate-500 hover:text-indigo-400"><i class="fa-regular fa-copy text-xs"></i></button>
                        </div>` : ''}
                    </div>
                    ${item.notes ? `
                    <div class="bg-indigo-950/20 border border-indigo-800/20 rounded-xl p-2 flex justify-between items-center gap-2">
                        <div class="text-[11px] text-indigo-300 break-all ${!isNoteVisible ? 'mask-text' : ''}">${escapeHtml(displayNotes)}</div>
                        <button onclick="toggleNoteVisibility(${item.id})" class="text-slate-500 hover:text-indigo-400 p-1"><i class="fa-solid ${isNoteVisible ? 'fa-eye-slash' : 'fa-eye'} text-xs"></i></button>
                    </div>` : ''}
                `;
                mobileContainer.appendChild(card);
            });
        }

        function toggleVisibility(id) { visiblePasswords[id] = !visiblePasswords[id]; filterRecords(); }
        function toggleNoteVisibility(id) { visibleNotes[id] = !visibleNotes[id]; filterRecords(); }

        function toggleAllVisibility() {
            allVisible = !allVisible;
            document.getElementById('toggle-all-icon').className = allVisible ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
            document.getElementById('toggle-all-text').textContent = allVisible ? "Ocultar" : "Revelar Todo";
            if (!allVisible) { visiblePasswords = {}; visibleNotes = {}; }
            filterRecords();
        }

        function toggleSearchInputVisibility() {
            const input = document.getElementById('search-input');
            const icon = document.getElementById('toggle-search-icon');
            input.type = input.type === "password" ? "text" : "password";
            icon.className = input.type === "password" ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
        }

        function filterRecords() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            document.getElementById('clear-search').classList.toggle('hidden', query.length === 0);
            const filtered = records.filter(item => 
                item.email.toLowerCase().includes(query) ||
                item.password.toLowerCase().includes(query) ||
                item.notes.toLowerCase().includes(query)
            );
            renderData(filtered);
        }

        function clearSearch() { document.getElementById('search-input').value = ''; filterRecords(); }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => showToast("Copiado al portapapeles"));
        }

        function copyRow(email, password, notes) {
            let text = `Correo: ${email}`;
            if (password) text += ` | Clave: ${password}`;
            if (notes) text += ` | Notas: ${notes}`;
            navigator.clipboard.writeText(text).then(() => showToast("Fila copiada"));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-10');
            }, 2000);
        }

        function openModalForAdd() {
            if (!currentPasskey) { showToast("Primero desbloquea la app con la clave maestra"); return; }
            document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-key text-indigo-400"></i> Nuevo Registro';
            document.getElementById('modal-id').value = '';
            document.getElementById('record-form').reset();
            document.getElementById('record-modal').classList.remove('hidden');
        }

        function openModalForEdit(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;
            document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-400"></i> Editar Registro';
            document.getElementById('modal-id').value = record.id;
            document.getElementById('modal-email').value = record.email;
            document.getElementById('modal-password').value = record.password || '';
            document.getElementById('modal-notes').value = record.notes || '';
            document.getElementById('record-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('record-modal').classList.add('hidden');
            document.getElementById('record-form').reset();
        }

        function saveRecord(e) {
            e.preventDefault();
            const id = document.getElementById('modal-id').value;
            const email = document.getElementById('modal-email').value.trim();
            const password = document.getElementById('modal-password').value.trim();
            const notes = document.getElementById('modal-notes').value.trim();

            if (!email) return;

            if (id) {
                const index = records.findIndex(r => r.id == id);
                if (index !== -1) records[index] = { id: Number(id), email, password, notes };
            } else {
                records.unshift({ id: Date.now(), email, password, notes });
            }

            updateUrlHash();
            filterRecords();
            closeModal();
            showToast("Guardado y URL actualizada");
        }

        function deleteRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            if (confirm(`¿Eliminar registro?`)) {
                records = records.filter(r => r.id !== id);
                updateUrlHash();
                filterRecords();
                showToast("Registro eliminado");
            }
        }

        function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : ''; }
        function escapeJs(str) { return str ? str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"') : ''; }
    </script>
</body>
</html>
